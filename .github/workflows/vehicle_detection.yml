name: Vehicle Detection App Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:   # lets you run it manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Upgrade pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # 4. Install project requirements
      - name: Install requirements
        run: |
          pip install -r requirements.txt

      # 5. Find Python files
      - name: Show Python files
        run: |
          echo "Python files in repository:"
          find . -name "*.py" -not -path "./.git/*"

      # 6. Check syntax of ALL Python files
      - name: Check Python syntax
        run: |
          python -m compileall -q .

      # 7. Test important libraries
      - name: Test imports
        run: |
          python -c "import streamlit; print('Streamlit OK')"
          python -c "import cv2; print('OpenCV OK')"
          python -c "import numpy; print('NumPy OK')"
          python -c "import torch; print('PyTorch OK')"
          python -c "import ultralytics; print('Ultralytics OK')"
          python -c "import requests; print('Requests OK')"
          python -c "import PIL; print('Pillow OK')"

      # 8. Telegram test (message + photo)
      - name: Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Sending test message..."
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="✅ CI test: Telegram message works" | tee msg_response.json
          echo
          grep -q '"ok":true' msg_response.json || { echo "::error::sendMessage failed (see response above)"; exit 1; }

          echo "Creating test image..."
          python -c "from PIL import Image; Image.new('RGB', (300, 200), (200, 50, 50)).save('test.jpg')"

          echo "Sending test photo..."
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F caption="✅ CI test: Telegram photo works" \
            -F photo=@test.jpg | tee photo_response.json
          echo
          grep -q '"ok":true' photo_response.json || { echo "::error::sendPhoto failed (see response above)"; exit 1; }

      # 9. Finish
      - name: Build check completed
        run: |
          echo "======================================"
          echo "Vehicle Detection project check passed"
          echo "======================================"
